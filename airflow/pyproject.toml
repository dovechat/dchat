[tool.poetry]
name = "airflow-etl"
version = "0.1.0"
description = "Airflow ETL for myshop project"
authors = ["Don <don@example.com>"]
readme = ""
packages = []

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
django = "^4.2"
apache-airflow = "^3.1.5"
clickhouse-driver = "^0.2.10"
psycopg2-binary = "^2.9.11"
python-dotenv = "^1.2.1"
asyncpg = "^0.31.0"
django-mptt = "^0.18.0"
django-environ = "^0.12.0"
pika = "^1.3.2"
graphviz = "^0.21"
pydantic-settings = "^2.13.1"
minio = "^7.2.20"
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
redis = "^8.1.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)"
]
