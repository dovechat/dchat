<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>DoveChat — подключено</title>
<script src="//api.bitrix24.com/api/v1/"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 24px; }
  .card { background: #fff; border-radius: 8px; padding: 32px 24px; max-width: 360px; margin: 0 auto; box-shadow: 0 2px 8px rgba(0,0,0,.1); text-align: center; }
  .icon { font-size: 40px; margin-bottom: 12px; }
  h2 { font-size: 18px; margin-bottom: 8px; }
  p { color: #555; font-size: 14px; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">✅</div>
  <h2>Линия подключена</h2>
  <p id="msg">успешно привязана к Битрикс24.</p>
</div>
<script>
BX24.init(function() {});
var name = sessionStorage.getItem('connected_line');
if (name) document.getElementById('msg').textContent = '«' + name + '» успешно привязана к Битрикс24.';
</script>
</body>
</html>
