<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>DoveChat</title>
<script src="//api.bitrix24.com/api/v1/"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 24px; }
  .card { background: #fff; border-radius: 8px; padding: 24px; max-width: 400px; margin: 0 auto; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
  h2 { font-size: 18px; margin-bottom: 16px; }
  label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; }
  select, textarea { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 12px; font-size: 14px; }
  textarea { height: 80px; resize: vertical; }
  button { width: 100%; padding: 10px; background: #2d6cdf; color: #fff; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; }
  button:disabled { background: #a0b4e0; cursor: not-allowed; }
  .error { color: #c0392b; font-size: 13px; margin-bottom: 10px; display: none; }
  .success { color: #27ae60; font-size: 13px; margin-bottom: 10px; display: none; }
</style>
</head>
<body>
<div class="card">
  <h2>Написать клиенту</h2>
  <p class="error" id="error"></p>
  <p class="success" id="success"></p>
  <label>Линия</label>
  <select id="line-select" onchange="onLineChange()"><option value="">Загрузка...</option></select>
  <label>Канал</label>
  <select id="channel-select"><option value="">—</option></select>
  <label>Сообщение</label>
  <textarea id="text" placeholder="Введите текст..."></textarea>
  <button id="btn-send" onclick="doSend()">Отправить</button>
</div>
<script>
var memberId = '';
var contactId = '';
var linesData = [];

var CHANNEL_NAMES = {
  'telegram_bot': 'Telegram Bot',
  'telegram_user': 'Telegram User',
  'whatsapp_green': 'WhatsApp',
  'waba': 'WhatsApp Business',
  'vk': 'ВКонтакте',
};

BX24.init(function() {
  var info = BX24.placement.info();
  console.log('placement info:', JSON.stringify(info));
  var auth = BX24.getAuth();
  memberId = auth.member_id || '';
  contactId = info.options && info.options.ID || '';

  fetch('/crm/api/v1/outgoing/lines?member_id=' + encodeURIComponent(memberId))
    .then(function(r) { return r.json(); })
    .then(function(data) {
      linesData = data.lines || [];
      var sel = document.getElementById('line-select');
      sel.innerHTML = '';
      if (!linesData.length) {
        sel.innerHTML = '<option value="">Нет доступных линий</option>';
        return;
      }
      linesData.forEach(function(l) {
        var opt = document.createElement('option');
        opt.value = l.id;
        opt.textContent = l.name;
        sel.appendChild(opt);
      });
      onLineChange();
    })
    .catch(function() {
      document.getElementById('line-select').innerHTML = '<option value="">Ошибка загрузки</option>';
    });
});

function onLineChange() {
  var lineId = document.getElementById('line-select').value;
  var line = linesData.find(function(l) { return l.id === lineId; });
  var sel = document.getElementById('channel-select');
  sel.innerHTML = '';
  if (!line || !line.channels || !line.channels.length) {
    sel.innerHTML = '<option value="">Нет каналов</option>';
    return;
  }
  line.channels.forEach(function(c) {
    var opt = document.createElement('option');
    opt.value = c.id;
    opt.textContent = CHANNEL_NAMES[c.channel_type] || c.channel_type;
    sel.appendChild(opt);
  });
}

async function doSend() {
  var lineId = document.getElementById('line-select').value;
  var channelAccountId = document.getElementById('channel-select').value;
  var text = document.getElementById('text').value.trim();
  var err = document.getElementById('error');
  var succ = document.getElementById('success');
  var btn = document.getElementById('btn-send');
  err.style.display = 'none';
  succ.style.display = 'none';

  if (!lineId || !channelAccountId || !text) {
    err.textContent = 'Выберите линию, канал и введите текст';
    err.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Отправка...';

  try {
    var resp = await fetch('/crm/api/v1/outgoing/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        member_id: memberId,
        contact_id: contactId,
        line_id: lineId,
        channel_account_id: channelAccountId,
        text: text,
      }),
    });
    var data = await resp.json();
    if (data.error) {
      err.textContent = data.error;
      err.style.display = 'block';
    } else if (data.status === 'exists') {
      err.textContent = 'Диалог с клиентом уже открыт';
      err.style.display = 'block';
    } else {
      succ.textContent = 'Сообщение отправлено';
      succ.style.display = 'block';
      document.getElementById('text').value = '';
    }
  } catch(e) {
    err.textContent = 'Ошибка подключения';
    err.style.display = 'block';
  }

  btn.disabled = false;
  btn.textContent = 'Отправить';
}
</script>
</body>
</html>
