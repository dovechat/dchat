services:
  db:
    image: postgres:16-alpine
    networks:
      - dchat_net
    container_name: postgres-dchat
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5


  rdb:
    image: "redis:alpine"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - dchat_net

  account:
    build: .
    image: account:1
    volumes:
      - ..:/mono
      - ../infra:/mono/infra
      - .:/mono/account
      - ../repo:/mono/repo
      - ../schemas:/mono/schemas
      - ../models:/mono/models
      - ../core:/mono/core
      - ../services:/mono/services
      - ../.env:/mono/.env
    env_file:
      - ../.env
    working_dir: /mono/account
    command: python3 -m app.api.main
    networks:
      - dchat_net
    depends_on:
      db:
        condition: service_healthy
      rdb:
        condition: service_healthy

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - app-network

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - app-network


volumes:
  postgres_data:

networks:
  dchat_net:
    driver: bridge